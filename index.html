<style>

* { box-sizing: border-box; }

<body>

<div class="wrap">
  <header>

  <section class="card" aria-labelledby="s1">

          <div><button class="btn" type="button" id="usePaste" data-i="usePaste"></button></div>

    <div class="opts">
      <label class="opt" for="target"><span data-i="target"></span>

      <label class="opt" for="sims"><span data-i="sims"></span>

      <label class="opt" for="plan" id="looksWrap"><span data-i="looks"></span>

<script id="core" type="text/plain">
// Port of code/design_tool.py (Wang & Sano). Same models, rules and defaults.
const SENDAI = { period: 31.92, r2: 0.49, phi_res: 0.40, phi_all: 0.68 };
function linspace(a, b, n) { const o = []; for (let i = 0; i < n; i++) o.push(a + (b - a) * i / (n - 1)); return o; }
const PS = linspace(8, 80, 145);

function makeRng(seed) {
  let a = seed >>> 0, spare = null;
  const u = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const n = () => {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let x, y, r; do { x = 2 * u() - 1; y = 2 * u() - 1; r = x * x + y * y; } while (r === 0 || r >= 1);
    const f = Math.sqrt(-2 * Math.log(r) / r); spare = y * f; return x * f;
  };
  return { u, n };
}

function ar1(R, n, phi, sd) {
  const s = new Float64Array(n), es = sd * Math.sqrt(1 - phi * phi); s[0] = R.n() * sd;
  for (let i = 1; i < n; i++) s[i] = phi * s[i - 1] + R.n() * es;
  return s;
}

function inv3(m) {
  const [a, b, c, d, e, f, g, h, k] = m;
  const A = e * k - f * h, B = -(d * k - f * g), C = d * h - e * g;
  const det = a * A + b * B + c * C;
  return [A / det, -(b * k - c * h) / det, (b * f - c * e) / det,
          B / det, (a * k - c * g) / det, -(a * f - c * d) / det,
          C / det, -(a * h - b * g) / det, (a * e - b * d) / det];
}

// least-squares sinusoid scanner for fixed sampling times t and candidate periods ps
function scanner(t, ps) {
  ps = ps || PS; const n = t.length;
  const B = ps.map(P => {
    const s = new Float64Array(n), c = new Float64Array(n); let ss = 0, cc = 0, s1 = 0, c1 = 0, sc = 0;
    for (let i = 0; i < n; i++) { const w = 2 * Math.PI * t[i] / P; s[i] = Math.sin(w); c[i] = Math.cos(w); s1 += s[i]; c1 += c[i]; ss += s[i] * s[i]; cc += c[i] * c[i]; sc += s[i] * c[i]; }
    return { P, s, c, inv: inv3([n, s1, c1, s1, ss, sc, c1, sc, cc]) };
  });
  function sums(v) { let S = 0, vv = 0; for (let i = 0; i < n; i++) { S += v[i]; vv += v[i] * v[i]; } return [S, vv, vv - S * S / n]; }
  function r2of(b, v, S, vv, sst) {
    let Ss = 0, Sc = 0; for (let i = 0; i < n; i++) { Ss += b.s[i] * v[i]; Sc += b.c[i] * v[i]; }
    const q = [S, Ss, Sc], m = b.inv; let proj = 0;
    for (let r = 0; r < 3; r++) proj += q[r] * (m[3 * r] * q[0] + m[3 * r + 1] * q[1] + m[3 * r + 2] * q[2]);
    return 1 - (vv - proj) / sst;
  }
  return {
    best(v) { const [S, vv, sst] = sums(v); let br = 0, bp = 0; for (const b of B) { const r = r2of(b, v, S, vv, sst); if (r > br) { br = r; bp = b.P; } } return [br, bp]; },
    curve(v) { const [S, vv, sst] = sums(v); return B.map(b => r2of(b, v, S, vv, sst)); },
  };
}

function fit(t, y, P) {
  const n = t.length; let s1 = 0, c1 = 0, ss = 0, cc = 0, sc = 0, Y = 0, Ys = 0, Yc = 0;
  for (let i = 0; i < n; i++) { const w = 2 * Math.PI * t[i] / P, s = Math.sin(w), c = Math.cos(w); s1 += s; c1 += c; ss += s * s; cc += c * c; sc += s * c; Y += y[i]; Ys += y[i] * s; Yc += y[i] * c; }
  const m = inv3([n, s1, c1, s1, ss, sc, c1, sc, cc]); const q = [Y, Ys, Yc];
  const b = [0, 1, 2].map(r => m[3 * r] * q[0] + m[3 * r + 1] * q[1] + m[3 * r + 2] * q[2]);
  const pred = tt => b[0] + b[1] * Math.sin(2 * Math.PI * tt / P) + b[2] * Math.cos(2 * Math.PI * tt / P);
  const res = Array.from(y, (v, i) => v - pred(t[i]));
  return { b, pred, res };
}

const mean = v => { let s = 0; for (const x of v) s += x; return s / v.length; };
const pvar = v => { const m = mean(v); let s = 0; for (const x of v) s += (x - m) * (x - m); return s / v.length; };
// week-to-week autocorrelation from pairs of samples exactly one week apart (gaps are not treated as adjacent);
// falls back to pairs two weeks apart (square root) and then to consecutive samples when too few pairs exist
function lag1w(t, v) {
  const m = mean(v); let ss = 0; for (const x of v) ss += (x - m) * (x - m);
  // scaled so that a record without gaps gives exactly the usual lag-1 estimate
  const at = k => { const pos = new Map(t.map((x, i) => [Math.round(x), i])); let s = 0, n = 0;
    t.forEach((x, i) => { const j = pos.get(Math.round(x) + k); if (j !== undefined) { s += (v[i] - m) * (v[j] - m); n++; } }); return n >= 10 ? s / ss * (v.length - 1) / n : null; };
  const r1 = at(1); if (r1 !== null) return r1;
  const r2 = at(2); if (r2 !== null) return Math.sign(r2) * Math.sqrt(Math.abs(r2));
  return lag1(v);
}
function lag1(v) { const m = mean(v); let a = 0, b = 0; for (let i = 0; i < v.length; i++) { const d = v[i] - m; b += d * d; if (i) a += (v[i - 1] - m) * d; } return a / b; }
function percentile(arr, q) { const a = Array.from(arr).sort((x, y) => x - y); const h = (a.length - 1) * q / 100, lo = Math.floor(h), hi = Math.ceil(h); return a[lo] + (a[hi] - a[lo]) * (h - lo); }
const arange = (a, b, s) => { const o = []; for (let x = a; x < b; x += s) o.push(x); return o; };
const every = (v, s) => Array.from(v).filter((_, i) => i % s === 0);

function estimate(t, y) {
  const n = y.length, span = t[n - 1] - t[0]; const [, P0] = scanner(t).best(y);
  if (span >= 1.5 * 52 && P0 <= span / 1.5) {
    const f = fit(t, y, P0);

// how often to check: share of simulated catchments confirmed by each record length, weekly sampling, and the

function redNoise(idx, phi, alpha, sims, R, ps) {

function toWeeks(tw, y) {

  const t = [...m.keys()].sort((a, b) => a - b); return { t, y: t.map(k => mean(m.get(k))) };
}

    const v = new Float64Array(tt.length);

const EX_OPT = { target: 0.8, sims: 1000, plan: [52, 78, 104], seed: 1, miss: 0 };
function showExample(n) {
  EXAMPLE = n; DATA = null; RAW = null; $('dataErr').hidden = true;
  MODE = n <= 26 ? 'design' : 'check'; syncMode(); showExampleMode();
}
function showExampleMode() {
  $('target').value = '0.8'; $('sims').value = '1000'; $('plan').value = '52, 78, 104'; $('miss').value = '0';
  $('status').textContent = ''; $('prog').style.width = '0';
  document.querySelectorAll('#examples .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.n === String(EXAMPLE))));
  LAST = { mode: MODE, res: EXAMPLES[EXAMPLE].res[MODE], opt: EX_OPT }; renderSummary(); renderResults();
}
function renderExampleSummary() {
  const E = EXAMPLES[EXAMPLE], s = E.summary;
  $('summary').innerHTML = `<span class="tag">${tr('exTag')}</span>` + tr('summary', { n: s.n, w: s.w, a: s.a, b: s.b });
  const q = [`<li>${tr('qCov', { k: s.k, w: s.w, c: Math.round(100 * s.k / s.w) })}</li>`];
  if (s.gap > 0) q.push(`<li>${tr('qGapOk', { g: s.gap })}</li>`);
  if (s.ni) q.push(`<li>${tr('qInterp', { n: s.ni })}</li>`);
  q.push(`<li>${tr('exNote')}</li>`);
  $('quality').innerHTML = q.join('');
  $('seriesChart').innerHTML = exSeriesSVG(E, LAST && LAST.mode === 'check' ? LAST.res : null);
}
function renderSummary() {
  if (!DATA && EXAMPLE) { renderExampleSummary(); return; }
  if (!DATA) return;
  const r = DATA.rows, w = Math.round(DATA.t[DATA.t.length - 1]) + 1;
  $('summary').innerHTML = (EXAMPLE ? `<span class="tag">${tr('exTag')}</span>` : '') + tr('summary', { n: r.length, w, a: iso(r[0].d), b: iso(r[r.length - 1].d) });
  const wk = [...new Set(DATA.tr)].sort((a, b) => a - b), cov = wk.length / w; let gap = 0;
  for (let i = 1; i < wk.length; i++) gap = Math.max(gap, wk[i] - wk[i - 1] - 1);
  const q = [`<li>${tr('qCov', { k: wk.length, w, c: Math.round(100 * cov) })}</li>`];
  if (cov < 0.7) q.push(`<li class="warn">${tr('qCovLow')}</li>`);
  if (gap >= 8) q.push(`<li class="warn">${tr('qGap', { g: gap })}</li>`); else if (gap > 0) q.push(`<li>${tr('qGapOk', { g: gap })}</li>`);
  if (DATA.nc) q.push(`<li class="${DATA.nc / r.length > 0.2 ? 'warn' : ''}">${tr('qLod_' + DATA.lodSrc, { n: DATA.nc })}${DATA.nc / r.length > 0.2 ? ' ' + tr('qLodHigh') : ''}</li>`);
  if (DATA.ambiguous) q.push(`<li class="warn">${tr('qAmb')}</li>`);
  $('quality').innerHTML = q.join('');
  const fitP = LAST && LAST.mode === 'check' ? LAST.res : null;
  $('seriesChart').innerHTML = seriesSVG(DATA, fitP);
}

// ---------- charts ----------
function niceTicks(a, b, n) { const step = Math.pow(10, Math.floor(Math.log10((b - a) / n))); const m = [1, 2, 5, 10].find(k => (b - a) / (k * step) <= n) * step; const o = []; for (let v = Math.ceil(a / m) * m; v <= b + 1e-9; v += m) o.push(+v.toFixed(10)); return o; }
function frame(W, H, M) { return { W, H, M, iw: W - M.l - M.r, ih: H - M.t - M.b }; }
function seriesSVG(D, res) {
  const F = frame(560, 250, { l: 46, r: 12, t: 10, b: 38 });
  const tmax = Math.max(D.t[D.t.length - 1], res ? res.weeks + 12 : 0) + 1;
  const ymin = Math.min(...D.y) - 0.08, ymax = Math.max(...D.y) + 0.08;
  const X = v => F.M.l + v / tmax * F.iw, Y = v => F.M.t + (1 - (v - ymin) / (ymax - ymin)) * F.ih;
  let g = '';
  // log-scale ticks at 1, 3, 10, 30 ... (only powers of ten when the data span more than three decades)
  const dec = ymax - ymin, yt = [];
  for (let k = Math.floor(ymin); k <= Math.ceil(ymax); k++) for (const m of (dec > 3 ? [1] : [1, 3])) { const v = Math.log10(m) + k; if (v >= ymin && v <= ymax) yt.push(v); }

let worker = null, BUSY = false;

  catch (err) { self.postMessage({ error: String(err && err.message || err) }); } };`;

  return worker;
}
function run() {

  const opt = { target: +$('target').value, sims: +$('sims').value, plan, seed: 1, miss: +$('miss').value };
  const err = $('dataErr');
  if (MODE === 'check' && !plan.length) { err.textContent = tr('ePlan'); err.hidden = false; return; }
  if (MODE === 'check' && DATA.tr[DATA.tr.length - 1] + 1 < 26) { err.textContent = tr('eShortCk', { w: DATA.tr[DATA.tr.length - 1] + 1 }); err.hidden = false; }
  const btn = $('run'); btn.disabled = true; $('status').textContent = tr('running') + '…'; $('prog').style.width = '2%';
  if (BUSY && worker) { worker.terminate(); worker = null; }   // a newer request replaces one still running
  BUSY = true;

  w.onmessage = e => {
    if (e.data.prog !== undefined) { $('prog').style.width = Math.round(e.data.prog * 100) + '%'; return; }
    btn.disabled = false; BUSY = false;
    if (e.data.error) { $('status').textContent = e.data.error; return; }
    $('status').textContent = tr('done', { s: ((performance.now() - t0) / 1000).toFixed(1) });

}

function syncMode() {
  $('mode-design').setAttribute('aria-pressed', String(MODE === 'design')); $('mode-check').setAttribute('aria-pressed', String(MODE === 'check'));
  $('looksWrap').hidden = MODE !== 'check'; $('looksHint').hidden = MODE !== 'check'; $('missWrap').hidden = MODE !== 'design';
}
$('lang-zh').onclick = () => { LANG = 'zh'; try { localStorage.setItem('iga-lang', 'zh'); } catch (e) {} applyLang(); };
$('lang-en').onclick = () => { LANG = 'en'; try { localStorage.setItem('iga-lang', 'en'); } catch (e) {} applyLang(); };
$('mode-design').onclick = () => { MODE = 'design'; syncMode(); if (DATA) run(); else if (EXAMPLE) showExampleMode(); };
$('mode-check').onclick = () => { MODE = 'check'; syncMode(); if (DATA) run(); else if (EXAMPLE) showExampleMode(); };
$('run').onclick = run;
$('pasteToggle').onclick = () => { $('pasteBox').hidden = !$('pasteBox').hidden; if (!$('pasteBox').hidden) $('pasteText').focus(); };
$('usePaste').onclick = () => loadRaw(parseText($('pasteText').value), null);
$('lod').onchange = () => { if (RAW && !RAW.ex) { loadRaw(RAW, null); if (DATA) run(); } };
$('file').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => loadRaw(parseText(String(rd.result)), null); rd.readAsText(f); };
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => loadRaw(parseText(String(rd.result)), null); rd.readAsText(f); });
$('copy').onclick = () => {
  const txt = resultText(); if (!txt) return;
  const fb = () => { const ta = $('copyFallback'); ta.hidden = false; ta.value = txt; ta.select(); $('copyMsg').textContent = tr('copyFail'); };
  try { navigator.clipboard.writeText(txt).then(() => { $('copyMsg').textContent = tr('copied'); }, fb); } catch (e) { fb(); }
};
applyLang(); showExample(26);
</script>
